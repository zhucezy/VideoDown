name: videodown_android
description: VideoDown 安卓客户端 - 解析各平台视频/图片链接并下载无水印原片
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0            # 调用服务端 REST
  gallery_saver: ^2.0.4   # 保存视频/图片到相册（自动处理权限）
  shared_preferences: ^2.2.0  # 本地历史记录
  flutter_spinkit: ^5.2.0 # 加载动画
  clipboard: ^0.1.3       # 读取/写入剪贴板

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
